<main><header><div><h1>细窗格、花藤与云边的下午茶</h1><p>住宅和咖啡厅的这一轮近景精修：收敛瓦片色差，细化门窗与屋檐，补上攀爬花藤、布伞弧度、桌边杯碟和细木纹。延续现有的分区、坡地、弯溪与粉色花树。</p></div><a href="../../viewer/">回到动态小岛 ↗</a></header>
<section><figure><img src="house_detail.png" alt="住宅精修近景：多格拱窗、蓝绿色屋顶、白粉花藤和门前小檐"><figcaption><h2>住宅 · 木石与花藤</h2><p class="note">多格拱窗、窗帘、细圆窗框、门扉五金与弯曲的小屋檐；保留住宅的占地和高度。</p></figcaption></figure><figure><img src="cafe_detail.png" alt="咖啡厅精修近景：暖木屋顶、格窗、粉白曲面遮阳伞和小圆桌"><figcaption><h2>咖啡厅 · 布伞与暖木</h2><p class="note">稍降低屋脊，统一木瓦色系，增加后墙格窗和屋檐花藤；遮阳伞有柔和弧度、压边和伞骨。</p></figcaption></figure></section>
<section><figure><img src="../landscape/hero.png" alt="上一轮地形与树木版本，同一主视角"><figcaption><h2>上一轮</h2><p class="note">已完成地形、树丛和粉色花树。</p></figcaption></figure><figure><img src="hero.png" alt="建筑精修后的浮岛，同一主视角"><figcaption><h2>本轮 · 同一主视角</h2><p class="note">在整岛中检查建筑比例与远看时的色彩关系。</p></figcaption></figure></section>
