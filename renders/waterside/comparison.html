<main><header><div><h1>让弯溪流过石桥，落入云海</h1><p>按约定顺序完成第一步：浅岸与深水的色差、绕石水纹、连续河岸、分块拱石和木栏杆，以及有泡沫与渐隐的瀑布。保留建筑精修、粉色花树与现有分区。</p></div><a href="../../viewer/">回到动态小岛 ↗</a></header>
<section><figure><img src="bridge_detail.png" alt="石桥近景：分块拱石、石桥面、圆头木栏杆和浅色河岸"><figcaption><h2>溪流与石桥</h2><p class="note">桥面磨边、拱石、木栏连接和金属钉细化；桥头贴合地形，行走高度与模型实测一致。</p></figcaption></figure><figure><img src="river_detail.png" alt="弯溪近景：深浅水色、河岸石簇和绕石泡沫"><figcaption><h2>从浅岸到深水</h2><p class="note">沿弯曲河道连续过渡的岸线，加入湿石、苔藓、芦草和稀疏水纹。</p></figcaption></figure></section>
<figure class="wide"><img src="waterfall_detail.png" alt="瀑布近景：不同长度的水流、断续白沫和底部渐隐"><figcaption><h2>从河面到瀑布</h2><p class="note">水帘连接实际河口，加入粗细、长短变化与断续白沫；网页中流水、飞沫和薄雾持续运动。</p></figcaption></figure>
